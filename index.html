<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitish Harikrishnan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .bio {
            color: #cbd5e1;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Nitish Harikrishnan</h1>
        <p class="subtitle">Welcome to my personal site</p>
        
        <p class="bio">
            Hello! I am building my official website on GitHub Pages. This space will showcase my personal projects, studies, and ongoing work.
        </p>

        <div class="links">
            <a href="https://github.com" class="btn" target="_blank">My GitHub Profile</a>
        </div>

        <footer>
            &copy; 2026 Nitish Harikrishnan. All rights reserved.
        </footer>
    </div>

</body>
</html>
